NetworkConnectionManager:
  global:

  data:
    -
      name: local_step
      url: "step://localhost:1234/"
      protocol: v2x-step
      plugin: true
      config:
        # Add STEP-specific configuration parameters here
        param1: "value1"
      remote:
        sessionId: session1
        username: user
        password: pass
      links:
        -
          direction: push
          local_namespace: "/step"
          remote_namespace: "step.remote"
          include_schema: false
        -
          direction: pull
          local_namespace: "/step/local"
          remote_namespace: "step.local"
          include_schema: false