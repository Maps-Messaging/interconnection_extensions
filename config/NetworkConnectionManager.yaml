# Configuration Notes:
#
# 1. Extension JAR files must be mounted in the Docker container's plugins directory
#    See docker-compose.yml for volume mount configuration
#
# 2. Each extension requires its external system to be accessible from the container
#    Use appropriate networking configuration (host.docker.internal, container names, etc.)
#
# 3. For production use, consider using Docker secrets or environment variables
#    for sensitive credentials instead of hardcoding them in this file
#
# 4. See individual extension README files for detailed configuration options:
#    - v2x-step-extension/README.md
#    - pulsar-extension/README.md (pending)
#    - kafka-extension/README.md
#    - aws-sns-extension/README.md (pending)
#    - ibm-mq-extension/README.md (pending)
