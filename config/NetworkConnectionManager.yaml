# MapsMessaging Interconnection Extensions - Docker Configuration
#
# This is a template configuration file for running MapsMessaging with
# interconnection extensions in Docker. Copy and modify this file to
# configure your specific extensions.
#
# Uncomment and configure the extension sections you need.
#

NetworkConnectionManager:
  global:

  data:
