---
NetworkConnectionManager:
  global:

  data:
    -
      name: ros_bridge
      url: "ros://localhost"
      protocol: ros
      plugin: true
      config:
        # 1 | 2 | auto
        rosVersion: auto

        # strict | passthrough
        schema_mode: strict

        # Optional endpoint override understood by your ROS runtime deployment.
        endpoint: "localhost"

        nodeName: "maps-ros-bridge"

      links:
        # MAPS -> ROS
        -
          direction: push
          local_namespace: "/maps/ros/cmd_vel"
          remote_namespace: "/cmd_vel"
          include_schema: true

          # ROS convention fields
          ros_topic: "/cmd_vel"
          ros_version: "2"
          ros_package: "geometry_msgs"
          ros_type: "Twist"

        # ROS -> MAPS
        -
          direction: pull
          local_namespace: "/maps/ros/odom"
          remote_namespace: "/odom"
          include_schema: true

          ros_topic: "/odom"
          ros_version: "2"
          ros_package: "nav_msgs"
          ros_type: "Odometry"

# Schema convention emitted in MAPS data map:
# - maps.schema.kind = "ros"
# - maps.schema.id   = "ros://<version>/<package>/<type>"
# - ros.version, ros.package, ros.type, ros.topic
# - ros.md5 (ROS1 when available), ros.qos (ROS2 when available), ros.context
